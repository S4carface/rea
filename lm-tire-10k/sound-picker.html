<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pick the sounds</title>
<style>:root{--bg:#0b0b12;--fg:#f2f2f5;--card:#171724;--red:#d6262f}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,sans-serif;padding:20px 16px 40px;max-width:640px;margin:auto}
h1{font-size:24px;margin:0 0 6px}p{color:#b9b9c6;margin:0 0 14px}h2{font-size:18px;margin:26px 0 10px}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
button{background:var(--card);color:var(--fg);border:1px solid #2c2c40;border-radius:14px;padding:16px 12px;font:inherit;display:flex;gap:10px;align-items:center;cursor:pointer}button.on{border-color:var(--red);background:#2a1016}.pl{color:var(--red)}</style></head>
<body><h1>Which sounds are right?</h1><p>Turn your volume up and tap each one. These are real recordings, not computer-made. Then tell me the letters you like, for example "Squeal B, Grind A, Clunk C", or say none of them are right.</p><h2>Brake squeal</h2><div class="row"><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/fc3de304-e8c0-4b29-a5f2-7d2c4338dc6d.mp3"><span class="pl">&#9654;</span><b>Squeal A</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/c2073045-fb79-4fc1-bb11-106974e41982.mp3"><span class="pl">&#9654;</span><b>Squeal B</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/6ab6d09c-b73c-42ed-903f-3a9c276f479d.mp3"><span class="pl">&#9654;</span><b>Squeal C</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/81432adf-adac-4924-8b36-ef223de952a6.mp3"><span class="pl">&#9654;</span><b>Squeal D</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/4c22c206-d8a3-4d09-9df8-e369b0a43f8d.mp3"><span class="pl">&#9654;</span><b>Squeal E</b></button></div><h2>Metal grinding</h2><div class="row"><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/e0cd45b5-f282-4ce1-a962-c1f0dd2f50e8.mp3"><span class="pl">&#9654;</span><b>Grind A</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/3eade95f-da8a-4bf6-acdb-44804839ed86.mp3"><span class="pl">&#9654;</span><b>Grind B</b></button></div><h2>Clunk / knock</h2><div class="row"><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/328f7d57-6262-4ef3-9144-d8a4884a15ca.mp3"><span class="pl">&#9654;</span><b>Clunk A</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/3ddd200d-3ff2-42b8-861f-709a42b33abd.mp3"><span class="pl">&#9654;</span><b>Clunk B</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/d1b4c89f-3ae9-4448-9976-36bebe249d7f.mp3"><span class="pl">&#9654;</span><b>Clunk C</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/66f8ad92-a837-4122-9c60-91c6ff695929.mp3"><span class="pl">&#9654;</span><b>Clunk D</b></button><button data-src="https://d2ol7oe51mr4n9.cloudfront.net/user_3J7GmwaAlfLtCAzuTR3SWln76Vo/8221f0c5-43ec-4aa7-a6d0-37bdacfde56a.mp3"><span class="pl">&#9654;</span><b>Clunk E</b></button></div>
<script>var cur=null,cb=null;document.querySelectorAll('button[data-src]').forEach(function(b){b.addEventListener('click',function(){if(cur){cur.pause();cb.classList.remove('on');}if(cb===b){cur=null;cb=null;return;}cur=new Audio(b.dataset.src);cb=b;b.classList.add('on');cur.play();cur.onended=function(){b.classList.remove('on');};});});</script></body></html>
